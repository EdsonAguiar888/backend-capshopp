openapi: 3.0.3
info:
  title: CapShopp API
  version: 1.0.0
  description: |
    Documentação da API do aplicativo CapShopp, elaborada a partir dos
    Controllers, DTOs, Services e Enums presentes no backend analisado.

    A autenticação é baseada em sessão HTTP. Após o login, o cliente deve
    enviar o cookie JSESSIONID nas operações protegidas.

servers:
  - url: http://localhost:8080
    description: Servidor local (porta padrão assumida; confirmar na configuração da aplicação)

tags:
  - name: Autenticação
    description: Login, consulta da sessão e logout.
  - name: Administração
    description: Recursos administrativos.
  - name: Produtos
    description: Catálogo e gerenciamento de produtos.
  - name: Imagens
    description: Envio e consulta de imagens de produtos.
  - name: Pedidos
    description: Compras, consulta e gerenciamento de pedidos.

security:
  - CookieSession: []

paths:
  /api/auth/login:
    post:
      tags: [Autenticação]
      summary: Realizar login
      description: Autentica uma conta e inicia uma nova sessão HTTP. Uma sessão anterior, se existir, é invalidada.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: cliente@exemplo.com
              senha: senha123
      responses:
        '200':
          description: Login realizado com sucesso.
          headers:
            Set-Cookie:
              description: Cookie de sessão HTTP (JSESSIONID).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: E-mail ou senha inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [Autenticação]
      summary: Consultar conta autenticada
      description: Retorna os dados da conta associada à sessão atual.
      responses:
        '200':
          description: Dados da conta autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Autenticação]
      security: []
      summary: Encerrar sessão
      description: Invalida a sessão HTTP atual, caso exista.
      responses:
        '204':
          description: Sessão encerrada ou inexistente.

  /api/admin/dashboard:
    get:
      tags: [Administração]
      summary: Consultar dashboard administrativo
      description: Recurso restrito ao perfil ADMIN.
      responses:
        '200':
          description: Indicadores e listas de contas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/catalogo:
    get:
      tags: [Produtos]
      summary: Consultar catálogo de produtos
      description: Lista produtos ativos. A busca pelo nome não diferencia maiúsculas de minúsculas.
      security: []
      parameters:
        - name: nome
          in: query
          required: false
          description: Texto usado para filtrar produtos pelo nome. Quando omitido, considera texto vazio.
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Lista de produtos ativos encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdutoResponse'

  /api/produtos:
    get:
      tags: [Produtos]
      summary: Listar meus produtos
      description: Lista os produtos pertencentes ao lojista autenticado. Restrito ao perfil LOJISTA.
      responses:
        '200':
          description: Produtos do lojista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdutoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Produtos]
      summary: Cadastrar produto
      description: Cadastra um produto para o lojista autenticado. Restrito ao perfil LOJISTA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoRequest'
            example:
              nome: Camiseta CapShopp
              descricao: Camiseta básica
              preco: 59.90
              estoque: 20
              imagemUrl: https://exemplo.com/imagem.jpg
      responses:
        '201':
          description: Produto cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/produtos/{id}:
    put:
      tags: [Produtos]
      summary: Atualizar produto
      description: Atualiza os dados de um produto pertencente ao lojista autenticado. Se imagemUrl for nulo, a imagem atual é preservada.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoRequest'
      responses:
        '200':
          description: Produto atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Produtos]
      summary: Excluir produto
      description: Exclui o produto do lojista autenticado, desde que não esteja vinculado a nenhum pedido.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Produto excluído.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Produto vinculado a pedido; use a operação de desativação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/produtos/{id}/imagem:
    post:
      tags: [Imagens]
      summary: Enviar imagem para um produto
      description: |
        Envia um arquivo de imagem para um produto do lojista autenticado.
        O serviço aceita imagens JPG, PNG e WebP de até 2 MB.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: Arquivo JPG, PNG ou WebP, com tamanho máximo de 2 MB.
      responses:
        '200':
          description: Imagem salva e produto atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'
        '400':
          description: Arquivo vazio ou maior que 2 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Formato de imagem não aceito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Falha ao gravar a imagem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/imagens/{nome}:
    get:
      tags: [Imagens]
      summary: Consultar imagem
      description: Retorna o arquivo de imagem armazenado. O nome deve corresponder ao identificador gerado pelo serviço e à extensão jpg, png ou webp.
      security: []
      parameters:
        - name: nome
          in: path
          required: true
          description: Nome do arquivo de imagem, incluindo a extensão.
          schema:
            type: string
            pattern: '^[0-9a-f-]{36}\.(jpg|png|webp)$'
      responses:
        '200':
          description: Conteúdo da imagem.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Imagem não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/produtos/{id}/desativar:
    patch:
      tags: [Produtos]
      summary: Desativar produto
      description: Marca como inativo um produto pertencente ao lojista autenticado. A operação não exclui o registro.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Produto desativado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/compras:
    post:
      tags: [Pedidos]
      summary: Confirmar compra
      description: |
        Confirma uma compra para o cliente autenticado. Os itens são agrupados
        por lojista, podendo gerar mais de um pedido. O estoque é atualizado
        durante a operação. Restrito ao perfil CLIENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompraRequest'
            example:
              itens:
                - produtoId: 1
                  quantidade: 2
                - produtoId: 3
                  quantidade: 1
      responses:
        '201':
          description: Compra confirmada. Retorna os pedidos gerados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PedidoResumoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Algum produto informado não foi encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Produto inativo ou estoque insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/pedidos:
    get:
      tags: [Pedidos]
      summary: Listar pedidos da conta autenticada
      description: Clientes consultam seus pedidos; lojistas consultam os pedidos destinados à sua loja. Outros perfis não possuem acesso.
      responses:
        '200':
          description: Lista de pedidos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PedidoResumoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Consultar detalhes de um pedido
      description: Disponível somente ao cliente do pedido ou ao lojista responsável.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detalhes do pedido e seus itens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoDetalheResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Pedido não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/pedidos/{id}/itens:
    get:
      tags: [Pedidos]
      summary: Listar itens de um pedido
      description: Disponível somente ao cliente do pedido ou ao lojista responsável.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Itens do pedido.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemPedidoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Pedido não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/pedidos/{id}/concluir:
    patch:
      tags: [Pedidos]
      summary: Concluir pedido
      description: Altera o status para CONCLUIDO. Restrito ao lojista responsável pelo pedido, que deve estar PENDENTE.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedido concluído.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResumoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Pedido não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Pedido não está pendente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/pedidos/{id}/cancelar:
    patch:
      tags: [Pedidos]
      summary: Cancelar pedido
      description: Cancela um pedido pendente, desde que a conta autenticada seja o cliente ou lojista relacionado. O estoque dos produtos é restituído.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedido cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResumoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Pedido não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Pedido não está pendente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Cookie de sessão criado pelo endpoint POST /api/auth/login.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador numérico do recurso.
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Requisição inválida ou dados que não passaram pela validação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Autenticação necessária ou sessão inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Conta autenticada sem permissão para a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        senha:
          type: string
          format: password
          maxLength: 256

    ContaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
        perfil:
          $ref: '#/components/schemas/PerfilUsuario'

    DashboardResponse:
      type: object
      properties:
        lojas:
          type: integer
          format: int64
        clientes:
          type: integer
          format: int64
        produtos:
          type: integer
          format: int64
        contas:
          type: integer
          format: int64
        listaLojas:
          type: array
          items:
            $ref: '#/components/schemas/ContaResponse'
        listaClientes:
          type: array
          items:
            $ref: '#/components/schemas/ContaResponse'

    ProdutoRequest:
      type: object
      required: [nome, preco, estoque]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 255
        descricao:
          type: string
          nullable: true
          maxLength: 2000
        preco:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
        estoque:
          type: integer
          minimum: 0
        imagemUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: Quando informada, deve ser uma URL HTTP ou HTTPS válida.

    ProdutoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        lojistaId:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        preco:
          type: number
          format: double
        estoque:
          type: integer
        imagem:
          type: string
          nullable: true
          description: URL externa ou caminho retornado pelo serviço de imagens.
        ativo:
          type: boolean

    CompraRequest:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ItemCompraRequest'

    ItemCompraRequest:
      type: object
      required: [produtoId, quantidade]
      properties:
        produtoId:
          type: integer
          format: int64
          minimum: 1
        quantidade:
          type: integer
          minimum: 1

    PedidoResumoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        data:
          type: string
          format: date-time
        total:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/StatusPedido'

    PedidoDetalheResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        data:
          type: string
          format: date-time
        total:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/StatusPedido'
        clienteId:
          type: integer
          format: int64
        cliente:
          type: string
        lojistaId:
          type: integer
          format: int64
        loja:
          type: string
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedidoResponse'

    ItemPedidoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        produtoId:
          type: integer
          format: int64
        nome:
          type: string
        quantidade:
          type: integer
        precoUnitario:
          type: number
          format: double
        subtotal:
          type: number
          format: double

    PerfilUsuario:
      type: string
      enum: [ADMIN, LOJISTA, CLIENTE]

    StatusPedido:
      type: string
      enum: [PENDENTE, CONCLUIDO, CANCELADO]

    ErrorResponse:
      type: object
      description: Estrutura ilustrativa para respostas de erro; o formato efetivo depende da configuração de tratamento de exceções do Spring Boot.
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
